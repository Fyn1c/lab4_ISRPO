
name: run unittest on project

on:

  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unittests
        run: python3 -m unittest rectangle.py circle.py square.py triangle.py
